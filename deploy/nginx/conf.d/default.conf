# Reverse proxy for the homelab stack. Only cloudflared (on homelab-net)
# should ever connect here; no host ports are published.
#
# Hostnames are matched by subdomain prefix, so this file works for any
# domain: the apex zone goes to profile-app, analytics.* to Umami,
# status.* to Uptime Kuma.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Trust the Cloudflare real client IP (CF-Connecting-IP) when the immediate
# peer is cloudflared inside Docker/private address space.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Docker's embedded DNS: upstream names are resolved per request, so nginx
# starts even while a backend container is down and picks up IP changes.
resolver 127.0.0.11 valid=5s ipv6=off;

server_tokens off;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
    listen 80;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name analytics.*;

    location / {
        set $upstream http://umami:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name status.*;

    # Uptime Kuma uses WebSockets for its UI.
    location / {
        set $upstream http://uptime-kuma:3001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name ~^[^.]+\.[^.]+$;   # apex domain only (e.g. example.com)

    location / {
        set $upstream http://profile-app:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
